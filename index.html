<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Daymark — To-do list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> daymark</div>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="#today">Today</a>
      <a href="#tasks">Tasks</a>
    </nav>
    <div class="saved-note"><span class="saved-dot" aria-hidden="true"></span> Saved on this device</div>
  </header>
  <main>
    <div class="date-kicker" id="today-label">Your day</div>
    <h1 id="today">Today</h1>
    <p class="subtitle"><span class="task-count" id="remaining-count">0 tasks</span> left to bring across the finish line.</p>

    <form class="composer" id="task-form">
      <input id="task-input" type="text" maxlength="180" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
      <select id="priority-input" aria-label="Task priority">
        <option value="Normal">Normal</option>
        <option value="High">High priority</option>
        <option value="Low">Low priority</option>
      </select>
      <button class="add-button" type="submit">Add task <span aria-hidden="true">+</span></button>
    </form>

    <section id="tasks" aria-label="Your tasks">
      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>
      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <div class="empty-mark" aria-hidden="true">✳</div>
        <h2 id="empty-title">A little room to breathe.</h2>
        <p id="empty-message">Add a task above and make a start.</p>
      </div>
    </section>
    <p class="footer-note">One thing at a time is a good pace.</p>
  </main>
  <script>
    const storageKey = "daymark-tasks-v1";
    const form = document.querySelector("#task-form");
    const input = document.querySelector("#task-input");
    const priorityInput = document.querySelector("#priority-input");
    const list = document.querySelector("#task-list");
    const emptyState = document.querySelector("#empty-state");
    const remainingCount = document.querySelector("#remaining-count");
    const filterButtons = [...document.querySelectorAll(".filter-button")];
    let filter = "all";
    let tasks = loadTasks();

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved.filter(task => task && typeof task.id === "string" && typeof task.title === "string") : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
      } catch {
        document.querySelector(".saved-note").lastChild.textContent = " Storage unavailable";
      }
    }

    function render() {
      list.replaceChildren();
      const visibleTasks = tasks.filter(task => filter === "all" || (filter === "active" ? !task.completed : task.completed));
      const remaining = tasks.filter(task => !task.completed).length;
      remainingCount.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"}`;
      document.querySelector("#clear-completed").hidden = !tasks.some(task => task.completed);

      for (const task of visibleTasks) {
        const row = document.createElement("li");
        row.className = `task-row${task.completed ? " is-complete" : ""}`;

        const check = document.createElement("button");
        check.className = "check-button";
        check.type = "button";
        check.setAttribute("aria-label", `${task.completed ? "Mark as to do" : "Complete"}: ${task.title}`);
        check.setAttribute("aria-pressed", String(task.completed));
        check.addEventListener("click", () => {
          task.completed = !task.completed;
          saveTasks();
          render();
        });

        const copy = document.createElement("div");
        copy.className = "task-copy";
        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;
        const meta = document.createElement("div");
        meta.className = "task-meta";
        const priority = document.createElement("span");
        priority.className = "priority";
        priority.dataset.level = ["High", "Normal", "Low"].includes(task.priority) ? task.priority : "Normal";
        priority.textContent = priority.dataset.level;
        const added = document.createElement("span");
        added.textContent = task.completed ? "Completed" : "Added today";
        meta.append(priority, added);
        copy.append(title, meta);

        const remove = document.createElement("button");
        remove.className = "remove-button";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Delete task: ${task.title}`);
        remove.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        row.append(check, copy, remove);
        list.append(row);
      }

      const isEmpty = visibleTasks.length === 0;
      emptyState.hidden = !isEmpty;
      if (isEmpty) {
        const noTasks = tasks.length === 0;
        document.querySelector("#empty-title").textContent = noTasks ? "A little room to breathe." : filter === "active" ? "All caught up." : "Nothing here just yet.";
        document.querySelector("#empty-message").textContent = noTasks ? "Add a task above and make a start." : filter === "active" ? "Every task is done. Take the win." : "Your completed tasks will show up here.";
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      tasks.unshift({ id: crypto.randomUUID(), title, priority: priorityInput.value, completed: false });
      input.value = "";
      priorityInput.value = "Normal";
      filter = "all";
      filterButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === filter)));
      saveTasks();
      render();
      input.focus();
    });

    filterButtons.forEach(button => button.addEventListener("click", () => {
      filter = button.dataset.filter;
      filterButtons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      render();
    }));

    document.querySelector("#clear-completed").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    document.querySelector("#today-label").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" }).format(new Date());
    render();
  </script>
</body>
</html>
